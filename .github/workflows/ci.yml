# Host-simulator tests on every push and PR (no JieLi toolchain needed).
# Device packages and signed releases: release.yml (a tag vX.Y). The browser version: pages.yml (main).
name: host tests
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: tests/run_tests.sh
  web:
    # the browser version built and started headless (tests/web_smoke.mjs): a broken web build fails here, not on Pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Emscripten (the release workflow's version, at a fixed commit)
        run: |
          set -euo pipefail
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - name: Build the browser version
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./build.sh --web
      - name: Start it in headless Chromium
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/web_smoke.mjs
