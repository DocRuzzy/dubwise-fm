# The site on GitHub Pages, rebuilt from main on every merge: https://docruzzy.github.io/dubwise-fm/ — a front page,
# the browser version (emu/: the same firmware code, compiled to WebAssembly; the hub card's "play" link), the manual
# (manual/), the one-page cheat sheet (cheat/: the card's "cheat" link), how to install (install/), and the newest
# release's package (firmware/dubwise-latest.fwsc and firmware/dubwise-X.Y.fwsc: github.io sends CORS headers, so
# browser emulators such as fm1-emu can fetch it; GitHub's release downloads don't). Rebuilt after each release too.
# One-time setup: the repository's Settings -> Pages -> Source: "GitHub Actions".
name: browser version (Pages)

on:
  push:
    branches: [main]
  workflow_run:                                  # a release's packages, once the release workflow has attached them
    workflows: ["Build and attest firmware"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Emscripten (the release workflow's version, at a fixed commit)
        run: |
          set -euo pipefail
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - name: Build the emulator
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./build.sh --web
      - name: The site (a front page, the emulator, the manual, the cheat sheet, how to install)
        run: |
          set -euo pipefail
          mkdir -p site/emu site/manual site/cheat site/img
          cp -r tools/site/. site/                 # the front page and the install page
          cp app/docs/img/splash.png site/img/
          cp -r app/build/emu/. site/emu/
          rm -rf site/emu/o2                       # (build leftovers)
          python3 base/tools/manual_html.py app/docs/MANUAL.md site/manual/index.html --name DUBWISE \
            --repo https://github.com/DocRuzzy/dubwise-fm --tagline "a reggae and dub desk for the FM-1"
          cp -r app/docs/img site/manual/
          cp app/docs/cheatsheet.html site/cheat/index.html
      - name: The newest release's package (firmware/)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          # the newest published release carrying a .fwsc (pre-releases included; none yet: the site goes without)
          tag=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq \
            '[.[] | select(.draft | not) | select(any(.assets[]; .name | endswith(".fwsc")))][0].tag_name // empty')
          if [ -z "$tag" ]; then echo "No release with a package yet"; exit 0; fi
          gh release download "$tag" --pattern '*.fwsc' --pattern SHA256SUMS --dir site/firmware
          (cd site/firmware && grep ' [^ ]*\.fwsc$' SHA256SUMS | sed 's# [^ ]*/# #' | sha256sum --check -)
          pkg=$(ls site/firmware/*.fwsc | head -1)
          cp "$pkg" site/firmware/dubwise-latest.fwsc
          echo "$tag" > site/firmware/LATEST
          ls -l site/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}emu/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
