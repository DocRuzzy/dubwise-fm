# The browser version (the emulator: the same firmware code, compiled to WebAssembly) on GitHub Pages, rebuilt from
# main on every merge: https://docruzzy.github.io/dubwise-fm/emu/ (the hub card's "play" link, fmhub.json).
# One-time setup: the repository's Settings -> Pages -> Source: "GitHub Actions".
name: browser version (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: Emscripten (the release workflow's version, at a fixed commit)
        run: |
          set -euo pipefail
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8   # emsdk 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - name: Build the emulator
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./build.sh --web
      - name: The site (emu/, and a front page that goes there)
        run: |
          set -euo pipefail
          mkdir -p site/emu
          cp -r app/build/emu/. site/emu/
          rm -rf site/emu/o2                      # (build leftovers)
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>DUBWISE</title>
          <meta http-equiv="refresh" content="0; url=emu/"></head>
          <body><p><a href="emu/">DUBWISE in the browser</a></p></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}emu/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
