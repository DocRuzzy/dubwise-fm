# The template's build settings (tools/build.py)
name = "DUBWISE"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_11"           # TODO(P0.0): claim our own prefix (see base/docs/FIRMWARE-JSON.md)          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "Dubwise FM"
usb_product = "DUBWISE FM-1"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = false                    # no radio (roadmap P0.0): its RAM goes to the dub bus
ble_central = false
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "a dub mixing desk and riddim box for the FM-1"
repo = "https://github.com/DocRuzzy/dubwise-fm"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."                   # a sentence for the installer's footer: what your firmware is built from
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "DocRuzzy"      # who made it
description = "A reggae/dub groovebox where the mixing desk is the instrument: quantised mutes and solos, send throws into a feedback tape echo and a kickable spring, a stepped Big Knob filter, riddim templates and FM voices. Work in progress."
tags = ["groovebox", "synth"]    # from the list in docs/FIRMWARE-JSON.md; the build refuses another
install = "https://docruzzy.github.io/dubwise-fm/install/"   # the page that installs it
site = "https://docruzzy.github.io/dubwise-fm/"
screenshot = "app/docs/img/screen-playing.png"   # for the hubs' cards: a square PNG, at least 240 x 240, in your repository
