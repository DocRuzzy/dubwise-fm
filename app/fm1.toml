# The template's build settings (tools/build.py)
name = "DUBWISE"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_382"          # ours: "DUB" on a phone keypad. Dev builds FM-1_38200, releases FM-1_382XXYYZZ (9 digits: no identity on thefirmwarehub.com matches, 2026-11-08)
usb_manufacturer = "SpIllt Beats"
usb_product = "DUBWISE FM-1"
o2 = ["engine/engine.c", "engine/echo.c", "engine/voices.c", "engine/riddim.c", "engine/bigknob.c", "engine/chaneq.c", "engine/spring.c", "engine/chordv.c", "engine/leslie.c", "engine/lpc.c", "engine/d808.c", "engine/scenes.c", "engine/song.c", "engine/fxv.c", "engine/phaser.c", "engine/tape.c", "engine/motion.c"]   # separate units compiled at -O2 (the engine: the audio interrupt's side)
words = "words.tsv"
ble = false                    # no radio (roadmap P0.0): its RAM goes to the dub bus
ble_central = false
headphones = true             # 9.8: the headphone jack read (plat_headphones): OUTPUT AUTO's BASS+ with nothing in it
backup = true                  # backup and restore over USB (base/tools/fm1_backup.py): the saved project and settings
backup_ext = "dwb"
mirror = true                  # the screen and panel on a computer over USB (base/web/mirror/, tools/fm1_mirror.py; QoL review 5)
usb_audio_channels = 10        # the USB recording: the master on 1-2, the stems on 3-10 (SETUP: USB STEMS; QoL review 4)
usb_host = true                # SETUP USB PORT: KEYBOARD, a USB-MIDI keyboard into the FM-1 (QoL review 6)
midi_stamp = true              # MIDI in stamped where it lands (to 0.05 ms): MIDI CLOCK IN follows it tighter (QoL review 5)
crash_history = true           # 9.17: the stacks painted at each start (plat_stack_left, plat_stack_least_ever: the PERF page's
                               # STACK) and a crash's record kept in flash for a beta report (base/tools/fm1_remote.py crashes)
usb_audio_out_app = true       # the live input (P2.8): the computer's audio to channel 8. Needs fm1-base's proposed option
                               # (docs/upstream/usb-audio-to-app.md); until then ignored: the audio is mixed in after the render
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "a dub mixing desk and riddim box for the FM-1"
repo = "https://github.com/DocRuzzy/dubwise-fm"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."                   # a sentence for the installer's footer: what your firmware is built from
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "DocRuzzy (SpIllt Beats)"      # who made it
description = "A reggae/dub groovebox where the mixing desk is the instrument: quantised mutes and solos, send throws into a feedback tape echo and a kickable spring, a stepped Big Knob filter, riddim templates and FM voices. Work in progress."
tags = ["groovebox", "synth"]    # from the list in docs/FIRMWARE-JSON.md; the build refuses another
install = "https://docruzzy.github.io/dubwise-fm/install/"   # the page that installs it
site = "https://docruzzy.github.io/dubwise-fm/"
screenshot = "app/docs/img/screen-playing.png"   # for the hubs' cards: a square PNG, at least 240 x 240, in your repository
